name: Tests

# Runs the whole suite across all three services on every push and PR. A
# green Laravel run says nothing about the Python engines or the client, so
# all three jobs are required, not just the first one that happens to pass.
"on":
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Laravel (PHP 8.2)
    runs-on: ubuntu-latest
    # phpunit.xml pins DB_CONNECTION=sqlite / DB_DATABASE=:memory:, so no
    # database service is needed here - see server/phpunit.xml.
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # gd is required: FinancialAccountabilityTest uploads a fake image
          # via UploadedFile::fake()->image() and fails without it. The rest
          # cover what Laravel 12 + Sanctum + the test suite assume.
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, gd, bcmath, curl, xml, ctype, json, tokenizer, zip
          coverage: none
          tools: composer:v2

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Audit dependencies
        run: composer audit

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel test suite
        run: php artisan test

  client:
    name: Client (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

  ai-service:
    name: AI service (Python 3.13)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q

  migrations-mysql:
    name: Migrations on ${{ matrix.image }}
    runs-on: ubuntu-latest
    # The test suite above runs on SQLite, which does not enforce InnoDB's rule
    # that a foreign key must be backed by an index. On 2026-09-03 a migration
    # passed all 144 tests and still aborted on MariaDB with error 1553, and it
    # would have stopped scripts/setup-ec2.sh on its first deployment. This job
    # runs the real migration path against the engines actually in use:
    # mysql:8.4 is what compose.production.yml deploys, mariadb:10.4 is the
    # XAMPP development database.
    strategy:
      fail-fast: false
      matrix:
        image: ['mysql:8.4', 'mariadb:10.4']
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hiusa_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, pdo_mysql, mysqli, gd, bcmath, curl, xml, ctype, json, tokenizer, zip
          coverage: none
          tools: composer:v2

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Point the app at the database service
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=hiusa_db/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env

      - name: Run every migration forward and seed
        run: php artisan migrate:fresh --seed --force

      # A migration whose down() cannot run against seeded data cannot be rolled
      # back in production either. Exercise the newest one both ways.
      - name: Roll the newest migration back and forward again
        run: |
          php artisan migrate:rollback --step=1 --force
          php artisan migrate --force
