# Install as /etc/nginx/sites-available/hiusa and link it into sites-enabled.
# Replace YOUR_STATIC_IP with the certificate directory name Certbot printed. Confirm the PHP-FPM socket
# with `ls /run/php/`. Test with `sudo nginx -t` before reloading.
server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    root /var/www/hiusa/client/dist;
    index index.html;
    client_max_body_size 8M;

    ssl_certificate /etc/letsencrypt/live/YOUR_STATIC_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_STATIC_IP/privkey.pem;

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location = /reset-password {
        access_log off;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/ {
        client_max_body_size 110M;
        client_body_timeout 300s;
        try_files $uri @laravel;
    }
    location = /up {
        try_files $uri @laravel;
    }
    location @laravel {
        rewrite ^ /index.php last;
    }
    location = /index.php {
        internal;
        client_max_body_size 110M;
        client_body_timeout 300s;
        root /var/www/hiusa/server/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/hiusa/server/public/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location /storage/ {
        alias /var/www/hiusa/server/public/storage/;
    }
    location /uploads/ {
        alias /var/www/hiusa/server/public/uploads/;
    }
    location ~ /\. {
        deny all;
    }
}
