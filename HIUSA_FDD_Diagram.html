<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HIUSA Functional Decomposition Diagram</title>
  <style>
    :root {
      --ink: #111827;
      --line: #1f2937;
      --green: #a9d9ae;
      --orange: #f4a582;
      --cyan: #a9dbe2;
      --purple: #cdb6d8;
      --cream: #f3f1dc;
      --blue: #b8d7e8;
      --red: #f0b1a8;
      --gray: #d8d8d8;
      --teal: #badfdf;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: var(--ink);
      font-family: "Times New Roman", Times, serif;
    }

    .page {
      width: 1800px;
      margin: 24px auto;
      background: #fff;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.16);
      padding: 24px;
    }

    .actions {
      width: 1800px;
      margin: 18px auto 0;
      display: flex;
      gap: 10px;
      font-family: Arial, sans-serif;
    }

    button {
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      border-radius: 6px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    button.secondary {
      background: white;
      color: #0f172a;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      background: #fff;
    }

    .box {
      fill: #fff;
      stroke: #111827;
      stroke-width: 2;
      rx: 0;
      ry: 0;
    }

    .title-box {
      fill: #cfe6f5;
      stroke: #111827;
      stroke-width: 3;
    }

    .actor {
      stroke: #111827;
      stroke-width: 2;
    }

    .module {
      fill: var(--blue);
      stroke: #111827;
      stroke-width: 2;
    }

    .txt {
      font-size: 18px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .small {
      font-size: 15px;
      font-weight: 700;
    }

    .tiny {
      font-size: 13px;
      font-weight: 700;
    }

    .line {
      fill: none;
      stroke: #111827;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .thin {
      stroke-width: 1.8;
    }

    .admin-line { stroke: #2f7d3b; }
    .officer-line { stroke: #e8872d; }
    .head-line { stroke: #7a4ca0; }
    .student-line { stroke: #2f75b5; }

    @media print {
      body { background: white; }
      .actions { display: none; }
      .page { box-shadow: none; margin: 0; padding: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="actions">
    <button onclick="window.print()">Print / Save as PDF</button>
    <button class="secondary" onclick="downloadSvg()">Download SVG</button>
  </div>

  <main class="page">

      <!-- Module headings -->
      <rect x="35" y="330" width="175" height="72" class="module"></rect>

      <text x="122.5" y="374" class="small txt">&amp; Access</text>

      <path d="M122.5 402 L122.5 1220" class="line thin"></path>
      <path d="M332.5 402 L332.5 1045" class="line thin"></path>

      <!-- Child boxes: Account -->
      <rect x="155" y="430" width="150" height="100" class="box" fill="#e8f5e9"></rect>
      <text x="230" y="462" class="tiny txt">Authenticate &amp;</text><text x="230" y="482" class="tiny txt">Recover</text><text x="230" y="502" class="tiny txt">Account</text>
      <desc>Authenticate and Recover Account for Admin, SBO Officer, Department Head, and Student includes Enter Login Credentials, Validate Credentials by retrieving the account, verifying password, checking account status, establishing user session, verifying user role, redirecting to the role-based dashboard, and extends Recover Account with password reset request, reset link, token validation, new password confirmation, and password update.</desc>
      <rect x="155" y="560" width="150" height="100" class="box" fill="#e8f5e9"></rect>
      <text x="230" y="590" class="tiny txt">Manage User</text><text x="230" y="610" class="tiny txt">Accounts &amp;</text><text x="230" y="630" class="tiny txt">Permissions</text>
      <desc>Manage User Accounts and Permissions for Admin includes View User List with Search User and Filter User by Role, extends Add User Account with Enter User Information, Assign Role, Assign SBO Position, Save Record, extends Update User Account with View User Details, Edit User Information, Save Record, and extends Deactivate User Account with Confirm Deactivation, Update Account Status, Record Audit Log.</desc>
      <rect x="155" y="690" width="150" height="100" class="box" fill="#e8f5e9"></rect>
      <text x="230" y="740" class="tiny txt">Manage Profile</text>
      <desc>Manage Profile for Admin, SBO Officer, Department Head, and Student includes View Profile Information by retrieving and displaying profile details, extends Edit Profile Information with profile validation and saving changes, and extends Change Password with current password verification, new password validation, and password update.</desc>
      <rect x="155" y="820" width="150" height="100" class="box" fill="#e8f5e9"></rect>
      <text x="230" y="850" class="tiny txt">View Role-</text><text x="230" y="870" class="tiny txt">Based</text><text x="230" y="890" class="tiny txt">Dashboard</text>
      <desc>View Role-Based Dashboard for Admin, SBO Officer, Department Head, Student includes Identify User Role, Load Authorized Modules, Load Role-Based Summary, Display Dashboard, and extends Open Selected Module.</desc>

      <!-- Announcements -->
      <rect x="365" y="430" width="150" height="100" class="box" fill="#fff4dc"></rect>
      <text x="440" y="470" class="tiny txt">Manage</text><text x="440" y="492" class="tiny txt">Announcements</text>
      <desc>Manage Announcements for Admin and SBO Officer extends Generate Announcement Draft with Enter Announcement Details, Use Groq LLM, Save AI Output, extends Create Announcement with Enter Announcement Content and Save Record, extends Edit Announcement with View Announcement Details, Update Announcement Content, Save Record, includes Submit Announcement for Approval, Review Approval Request, extends Publish Approved Announcement with Update Announcement Status and Notify User, and includes Record Audit Log.</desc>
      <rect x="365" y="560" width="150" height="100" class="box" fill="#fff4dc"></rect>
      <text x="440" y="590" class="tiny txt">Review</text><text x="440" y="610" class="tiny txt">Announcement</text><text x="440" y="630" class="tiny txt">Requests</text>
      <rect x="365" y="690" width="150" height="100" class="box" fill="#fff4dc"></rect>
      <text x="440" y="720" class="tiny txt">View Calendar</text><text x="440" y="740" class="tiny txt">&amp;</text><text x="440" y="760" class="tiny txt">Notifications</text>
      <desc>View Announcements and Notifications for Admin, SBO Officer, Department Head, Student includes Load Published Announcements, Display Announcement List, extends Open Announcement Details with View Details, includes Load User Notifications, extends Open Notification Details, and extends Mark Notification as Read.</desc>
      <rect x="365" y="820" width="150" height="100" class="box" fill="#fff4dc"></rect>
      <text x="440" y="850" class="tiny txt">Manage</text><text x="440" y="870" class="tiny txt">Notification</text><text x="440" y="890" class="tiny txt">Preferences</text>

      <!-- Events -->
      <rect x="575" y="420" width="150" height="100" class="box" fill="#e3f2fd"></rect>
      <text x="650" y="452" class="tiny txt">Manage Events</text><text x="650" y="472" class="tiny txt">&amp;</text><text x="650" y="492" class="tiny txt">Scheduling</text>
      <desc>Manage Events and Scheduling for Admin extends Create Event with event details, schedule, budget details, vendor deadlines, logistics checklist, and Save Record; extends Edit Event; includes Submit Event for Approval, Review Approval Request, and Notify User.</desc>
      <rect x="575" y="540" width="150" height="100" class="box" fill="#e3f2fd"></rect>
      <text x="650" y="570" class="tiny txt">Review Event</text><text x="650" y="590" class="tiny txt">Approval</text>
      <rect x="575" y="660" width="150" height="100" class="box" fill="#d7f0ef"></rect>
      <text x="650" y="690" class="tiny txt">Generate Event</text><text x="650" y="710" class="tiny txt">Plan &amp; Workflow</text>
      <desc>Generate Event Plans and Workflows for Admin includes Select Event, Enter Event Planning Requirements, Generate Event Plan Using Groq LLM with timeline, resource checklist, and delay or conflict detection, extends Generate Workflow with task sequence, deadlines, event links, Save Workflow, and includes Save Generated Plan.</desc>
      <rect x="575" y="780" width="150" height="100" class="box" fill="#e3f2fd"></rect>
      <text x="650" y="810" class="tiny txt">Manage Event</text><text x="650" y="830" class="tiny txt">Operations</text>
      <rect x="575" y="900" width="150" height="100" class="box" fill="#e3f2fd"></rect>
      <text x="650" y="950" class="tiny txt">Track Attendance</text>
      <desc>Manage Attendance for Admin and SBO Officer includes Select Event, Load Attendance List, Record Manual Attendance, Record Biometric Attendance, and View Attendance Summary. Check In to Event for Admin, SBO Officer, Department Head, and Student includes Select Active Event, Verify User Identity, Submit Manual Attendance or Scan Biometric, Save Attendance Entry, and Display Attendance Confirmation.</desc>

      <!-- Tasks -->
      <rect x="785" y="430" width="150" height="100" class="box" fill="#fdeaea"></rect>
      <text x="860" y="480" class="tiny txt">Manage Tasks</text>
      <desc>Manage Tasks and Workflow for Admin extends Create Task with Enter Task Details, Set Task Deadline, optional Link Task to Event, and Save Record; includes Evaluate Officer Eligibility, Apply Rule-Based Weighted Scoring, Recommend Best-Fit Officer, Generate Task Explanation Using Groq LLM, Generate Workflow, Assign Task, and Monitor Task Status.</desc>

      <text x="860" y="592" class="tiny txt">Assign &amp;</text><text x="860" y="612" class="tiny txt">Delegate Tasks</text>
      <rect x="785" y="690" width="150" height="100" class="box" fill="#fdeaea"></rect>
      <text x="860" y="730" class="tiny txt">Workflow</text><text x="860" y="750" class="tiny txt">Automation</text>

      <text x="1070" y="985" class="tiny txt">Generate</text><text x="1070" y="1005" class="tiny txt">Financial</text><text x="1070" y="1025" class="tiny txt">Reports</text>

      <!-- Merchandise -->
      <rect x="1205" y="430" width="150" height="100" class="box" fill="#fff0df"></rect>
      <text x="1280" y="470" class="tiny txt">Manage</text><text x="1280" y="492" class="tiny txt">Inventory</text>
      <desc>Manage Merchandise Inventory for Admin extends Add Merchandise Item with Enter Item Details, Set Item Price, Set Stock Quantity, optional Upload Merchandise Image, and Save Record; extends Update Merchandise Item with View Item Details, Edit Item Information, Update Stock Level, and Save Record; extends Deactivate Merchandise Item with Confirm Deactivation and Record Audit Log.</desc>

      <desc>Order Merchandise and Claim Items for Admin, SBO Officer, Department Head, and Student includes Browse Merchandise Catalog, View Item Details, Check Item Availability, Reserve Merchandise Item with Enter Order Details, Save Order as Pending, Notify Officer, Submit GCash Payment Proof, Track Order Status, Receive Digital Receipt, Receive Claim Token, and Present Claim Token for Validation.</desc>
      <rect x="1205" y="690" width="150" height="100" class="box" fill="#fff0df"></rect>
      <text x="1280" y="720" class="tiny txt">Manage Orders</text><text x="1280" y="740" class="tiny txt">&amp; Fulfillment</text>
      <desc>Manage Merchandise Orders and Fulfillment for Admin and SBO Officer includes Load Pending Orders, View Order Details, Verify Payment Submission with View Payment Proof, Match Payment Amount, Validate GCash Reference, Mark Payment as Invalid, Approve Payment with Generate Digital Receipt, Generate Claim Token, Notify Buyer, Reject Payment, Validate Claim Token, Release Merchandise Item, and Update Order Status.</desc>
      <rect x="1205" y="820" width="150" height="100" class="box" fill="#fff0df"></rect>
      <text x="1280" y="850" class="tiny txt">Generate</text><text x="1280" y="870" class="tiny txt">Claim Tokens</text>
      <rect x="1205" y="950" width="150" height="100" class="box" fill="#fff0df"></rect>

      <desc>Manage Elections for Admin extends Create Election with Enter Election Details, Set Voting Period, Configure Election Positions, Save Record, extends Edit Election with View Election Details, Update Election Information, Save Record, includes Submit Election for Approval, Review Approval Request, extends Open Approved Election, and extends Close Election.</desc>

  <script>
    function downloadSvg() {
      const svg = document.getElementById('fdd');
      const clone = svg.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      const source = '<!DOCTYPE svg>\n' + clone.outerHTML;
      const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'HIUSA_FDD_Diagram.svg';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }
  </script>
