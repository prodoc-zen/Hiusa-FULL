  var svg = document.getElementById('diagram-svg');
  var serializer = new XMLSerializer();
  var source = serializer.serializeToString(svg);

  var svgBlob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
  var url = URL.createObjectURL(svgBlob);

  var scale = 2;
  var img = new Image();
  img.onload = function () {
    var canvas = document.createElement('canvas');
    canvas.width = 1000 * scale;
    canvas.height = 1560 * scale;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, 1000, 1560);
    URL.revokeObjectURL(url);

    canvas.toBlob(function (blob) {
      var link = document.createElement('a');
      link.download = 'hiusa-use-case-diagram.png';
      link.href = URL.createObjectURL(blob);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }, 'image/png');
  };
  img.onerror = function () {
    alert('Could not render the diagram to PNG in this browser. Try Chrome or Edge.');
    URL.revokeObjectURL(url);
  };
  img.src = url;
}
</script>

</body>
</html>
